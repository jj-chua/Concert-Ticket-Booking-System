version: '3.8'

services:
  availability-service:
    build: ./services/availability-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002

  booking-service:
    build: ./services/booking-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - AVAILABILITY_SERVICE_URL=http://availability-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
    depends_on:
      - availability-service

  notification-service:
    build: ./services/notification-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - booking-service